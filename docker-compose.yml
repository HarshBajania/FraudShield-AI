services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FRAUD_ENV: portfolio
      FRAUD_CORS: http://localhost:8080
      FRAUD_API_KEY: ${FRAUD_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
